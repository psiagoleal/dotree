# Caminho relativo: app/wasm/Cargo.toml
[package]
name = "dotree-wasm"
description = "wasm-bindgen bridge between dotree-core and the web interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotree-core = { path = "../core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
