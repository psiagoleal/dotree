# Caminho relativo: .github/workflows/ci.yml
# CI e publicação do dotree (spec 09, ADR 0002). Cada passo roda localmente pelo mesmo
# comando declarado na ilha "comandos-exatos" do AGENTS.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Núcleo Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Interface (check, lint, testes, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    env:
      BASE_PATH: /dotree
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build
      - run: pnpm run test:e2e
      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/web/playwright-report
          retention-days: 7
      - name: Artefato para o GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/web/build

  docker:
    name: Imagem Docker (build e fumaça)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dotree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Teste de fumaça (ENT-04)
        run: |
          docker run -d --name dotree -p 8080:8080 dotree:ci
          for _ in $(seq 1 20); do curl -fsS http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "<title>dotree</title>"
          wasm=$(docker exec dotree sh -c 'ls /usr/share/nginx/html/_app/immutable/assets/*.wasm | head -1 | sed "s#/usr/share/nginx/html##"')
          test -n "$wasm"
          ctype=$(curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:8080${wasm}")
          echo "content-type do .wasm: $ctype"
          test "$ctype" = "application/wasm"

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    name: Publicar no GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, web, docker, segredos]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Teste de fumaça pós-publicação (ENT-02)
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "${{ steps.deploy.outputs.page_url }}" | grep -q "<title>dotree</title>" && exit 0
            sleep 5
          done
          echo "o site publicado não respondeu com o título esperado" >&2
          exit 1
