# Caminho relativo: .github/dependabot.yml
# Atualização semanal de dependências (ENT-07).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /app/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
